```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love Tallia ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3,
                #8e44ad
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           TALLIA PHOTO
        ========================== */

        .photo-box {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 150px;
            text-align: center;
            z-index: 20;

            animation: popPhoto 2s infinite;
        }

        .photo-box img {
            width: 130px;
            height: 130px;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid white;

            box-shadow:
                0 0 15px white,
                0 0 30px #ff1744,
                0 0 50px #ff4081;

            animation: photoGlow 1.5s infinite alternate;
        }

        /* Popping animation */

        @keyframes popPhoto {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        @keyframes photoGlow {

            from {
                box-shadow:
                    0 0 10px white,
                    0 0 20px #ff1744;
            }

            to {
                box-shadow:
                    0 0 20px white,
                    0 0 40px #ff1744,
                    0 0 60px #ff80ab;
            }
        }

        /* =========================
           MY KAMUM TEXT
        ========================== */

        .kamum {
            margin-top: 10px;

            font-size: 22px;
            font-weight: bold;

            color: white;

            text-shadow:
                0 0 5px white,
                0 0 15px #ff1744,
                0 0 25px #ff1744;

            animation: textPop 1.2s infinite;
        }

        @keyframes textPop {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* =========================
           MAIN CONTENT
        ========================== */

        .container {
            text-align: center;
            color: white;
            z-index: 10;
            padding: 30px;
        }

        /* Main heart */

        .heart {
            position: relative;

            width: 100px;
            height: 100px;

            background: #ff1744;

            margin: 0 auto 45px;

            transform: rotate(-45deg);

            animation: heartbeat 1.2s infinite;

            box-shadow:
                0 0 20px #ff1744,
                0 0 40px #ff4081;
        }

        .heart::before,
        .heart::after {

            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            background: #ff1744;

            border-radius: 50%;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        @keyframes heartbeat {

            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }

            50% {
                transform: rotate(-45deg) scale(1.2);
            }
        }

        /* =========================
           MAIN TEXT
        ========================== */

        h1 {

            font-size: 45px;

            margin-bottom: 20px;

            text-shadow:
                0 0 10px white,
                0 0 20px #ff1744;

            animation: glow 2s infinite alternate;
        }

        @keyframes glow {

            from {
                text-shadow:
                    0 0 10px white;
            }

            to {
                text-shadow:
                    0 0 20px white,
                    0 0 40px #ff1744;
            }
        }

        p {

            font-size: 24px;

            line-height: 1.6;
        }

        .name {

            color: #fff700;

            font-weight: bold;
        }

        .love {

            margin-top: 20px;

            font-size: 30px;

            animation: loveBounce 1.5s infinite;
        }

        @keyframes loveBounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* =========================
           BUTTON
        ========================== */

        button {

            margin-top: 30px;

            padding: 12px 25px;

            border: none;

            border-radius: 30px;

            background: white;

            color: #ff4081;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: scale(1.1);

            background: #ffe4ec;
        }

        /* =========================
           FLOATING HEARTS
        ========================== */

        .floating-heart {

            position: absolute;

            bottom: -50px;

            font-size: 25px;

            pointer-events: none;

            animation: floatUp linear forwards;
        }

        @keyframes floatUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 600px) {

            .photo-box {

                top: 15px;
                left: 15px;

                width: 100px;
            }

            .photo-box img {

                width: 85px;
                height: 85px;
            }

            .kamum {

                font-size: 16px;
            }

            h1 {

                font-size: 32px;
            }

            p {

                font-size: 19px;
            }

            .heart {

                width: 70px;
                height: 70px;
            }

            .heart::before,
            .heart::after {

                width: 70px;
                height: 70px;
            }

            .heart::before {

                top: -35px;
            }

            .heart::after {

                left: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TALLIA PHOTO
    ========================== -->

    <div class="photo-box">

        <img src="1000418422.jpg" alt="Tallia">

        <div class="kamum">
            My Kamum ❤️
        </div>

    </div>


    <!-- =========================
         MAIN MESSAGE
    ========================== -->

    <div class="container">

        <div class="heart"></div>

        <h1>
            I Love You, My Love Tallia ❤️
        </h1>

        <p>

            You mean the world to me 🌍❤️<br>

            You are so special to my heart 💕<br>

            I will always cherish you 🥰

        </p>

        <div class="love">

            ❤️ 💕 💖 💗 💓 💞 ❤️

        </div>

        <button onclick="showLove()">

            Click Me ❤️

        </button>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* Create floating hearts */

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.classList.add(
                "floating-heart"
            );

            const hearts = [
                "❤️",
                "💕",
                "💖",
                "💗",
                "💓",
                "💞",
                "🥰"
            ];

            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (20 + Math.random() * 30) + "px";

            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {

                heart.remove();

            }, 9000);
        }


        /* Generate hearts continuously */

        setInterval(
            createHeart,
            400
        );


        /* Button message */

        function showLove() {

            alert(
                "My Kamum ❤️\n\n" +
                "You mean the world to me 🌍💕\n" +
                "I love you so much, Tallia 🥰❤️"
            );

        }

    </script>

</body>
</html>
